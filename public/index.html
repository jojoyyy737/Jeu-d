<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Les Dés</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="app"><header><div><span class="eyebrow">TABLE DE DÉS</span><h1>Les Dés</h1></div><button id="help" class="icon">?</button></header>
<section id="home" class="panel"><div class="felt"><div class="dice large"><span></span><span></span></div><p>La partie commence à deux.</p></div><div class="tabs"><button class="active" data-tab="createTab">Créer</button><button data-tab="joinTab">Rejoindre</button></div>
<div id="createTab" class="tab"><label>Votre nom<input id="createName" maxlength="18" placeholder="Ex. Junior"></label><label>Mise de la manche<input id="stake" type="number" min="100" step="100" value="500"></label><button id="create" class="primary">Créer une table</button></div>
<div id="joinTab" class="tab hidden"><label>Votre nom<input id="joinName" maxlength="18" placeholder="Ex. Awa"></label><label>Code de table<input id="roomCode" maxlength="6" placeholder="ABC123"></label><button id="join" class="primary">Rejoindre</button></div></section>
<section id="game" class="hidden"><div class="roombar"><span>TABLE <b id="code"></b></span><button id="copy">Partager</button></div><div id="players" class="players"></div><div class="arena"><div id="status" class="status">En attente</div><div class="dice" id="dice"><span></span><span></span></div><strong id="total">–</strong><div id="result" class="result"></div></div><div class="controls"><div id="lobbyControls"><button id="start" class="primary">Jouer</button><small>Minimum 2 joueurs</small></div><div id="playControls" class="hidden"><div class="pot">Cagnotte <b id="pot">–</b> F</div><label class="check"><input id="abattage" type="checkbox"> Abattage</label><div id="abattageFields" class="hidden"><select id="opponent"></select><input id="abattageStake" type="number" min="100" step="100" value="100"></div><button id="roll" class="primary">Lancer</button></div><button id="newRound" class="secondary hidden">Nouvelle manche</button></div></section>
<div id="toast" class="toast"></div></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
